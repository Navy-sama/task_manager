name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: ci
    # Skipped (not failed) until the GCP variables are configured in the repository.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Workload Identity Federation: no long-lived JSON key ever leaves GCP.
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/frontend:${{ github.sha }}

      # DATABASE_URL uses the Cloud SQL socket factory (see backend/pom.xml): no public IP,
      # authorized instead by --add-cloudsql-instances + the runtime SA's roles/cloudsql.client.
      - name: Deploy backend to Cloud Run
        id: deploy_backend
        run: |
          set -euo pipefail
          gcloud run deploy task-manager-backend \
            --image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/backend:${GITHUB_SHA}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --add-cloudsql-instances="${CLOUDSQL_INSTANCE}" \
            --min-instances=0 \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,DATABASE_URL=jdbc:mysql:///${DB_NAME}?cloudSqlInstance=${CLOUDSQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory,DATABASE_USERNAME=${DB_USER}" \
            --set-secrets="DATABASE_PASSWORD=DATABASE_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest" \
            --quiet
          echo "url=$(gcloud run services describe task-manager-backend --region="${GCP_REGION}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Wait for backend health check
        run: |
          set -euo pipefail
          url="${{ steps.deploy_backend.outputs.url }}"
          for i in $(seq 1 10); do
            if curl -fsS "${url}/actuator/health" > /dev/null; then
              echo "Backend healthy at ${url}"
              exit 0
            fi
            echo "Waiting for backend to become healthy... (${i}/10)"
            sleep 6
          done
          echo "::error::Backend did not become healthy in time" >&2
          exit 1

      # BACKEND_URL/BACKEND_HOST feed the frontend's nginx reverse-proxy template
      # (frontend/nginx/default.conf.template): full https URL and bare host respectively.
      - name: Deploy frontend to Cloud Run
        id: deploy_frontend
        run: |
          set -euo pipefail
          backend_url="${{ steps.deploy_backend.outputs.url }}"
          backend_host="${backend_url#https://}"
          gcloud run deploy task-manager-frontend \
            --image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/frontend:${GITHUB_SHA}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --set-env-vars="BACKEND_URL=${backend_url},BACKEND_HOST=${backend_host}" \
            --quiet
          echo "url=$(gcloud run services describe task-manager-frontend --region="${GCP_REGION}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Smoke test frontend
        run: curl -fsS "${{ steps.deploy_frontend.outputs.url }}" > /dev/null

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Deployment summary"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Backend | ${{ steps.deploy_backend.outputs.url }} |"
            echo "| Frontend | ${{ steps.deploy_frontend.outputs.url }} |"
            echo ""
            echo "### Rollback"
            echo '```bash'
            echo "gcloud run services update-traffic task-manager-backend --region=${GCP_REGION} --to-revisions=PREVIOUS=100"
            echo "gcloud run services update-traffic task-manager-frontend --region=${GCP_REGION} --to-revisions=PREVIOUS=100"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
