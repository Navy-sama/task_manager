name: task-manager

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskmanager}
      MYSQL_USER: ${MYSQL_USER:-taskmanager}
      # No default passwords: a default in a versioned file is a public password.
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env (see .env.example)}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env (see .env.example)}
    ports:
      # Bound to loopback only: never expose the database on a public interface.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Full-stack services: `docker compose up -d` still starts only MySQL; use
  # `docker compose --profile app up -d --build` to also build and run backend + frontend.
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # No SPRING_PROFILES_ACTIVE: the "dev" default profile already sets cookie-secure=false,
      # which matches this plain-http local stack (prod profile is exercised on Cloud Run only).
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-taskmanager}
      DATABASE_USERNAME: ${MYSQL_USER:-taskmanager}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      BACKEND_HOST: "backend:8080"
      PORT: "8080"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"

volumes:
  mysql_data:
