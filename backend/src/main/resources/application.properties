spring.application.name=task-manager-api
spring.profiles.default=dev
# Local secrets live in backend/.env (git-ignored); real environments inject variables instead.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/migration

# Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=task-manager-api
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
app.auth.cookie-secure=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Operations
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# API documentation
springdoc.swagger-ui.path=/swagger-ui.html
