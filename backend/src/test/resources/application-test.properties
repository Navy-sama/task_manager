# Local test database: H2 in MySQL mode, Flyway migrations applied exactly as in production.
# CI overrides the three datasource properties with a real MySQL 8.4 (SPRING_DATASOURCE_* variables).
# One database per Spring context (random name), so a context started by @DirtiesContext never sees another's state.
spring.datasource.url=jdbc:h2:mem:taskmanager-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Test-only key (Base64 of a throwaway string); never used outside the test suite.
app.jwt.secret=dGVzdC1vbmx5LWhtYWMta2V5LW5ldmVyLXVzZWQtb3V0c2lkZS10ZXN0cy0wMTIzNDU2Nzg5
app.auth.cookie-secure=false
